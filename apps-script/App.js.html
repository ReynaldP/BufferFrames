<script>
/* ==========================================================================
   Buffer AJU Frames : front-end (vanilla JS)
   Données : getDashboardData() (un seul JSON), écritures : saveBlockParams / saveGlobalParams / saveMapping
   ========================================================================== */
(function () {
  'use strict';

  var TV = window.APP_MODE === 'tv';
  var LS_KEY = 'bufferAJU.state.v1';
  var FILTER_KEYS = ['prog', 'ver', 'cadre', 'avar', 'cote', 'flux', 'st'];
  var STATUS = {
    ROUGE: { label: 'ROUGE', icon: '▼', order: 0, title: 'Sous le mini : produire ou appeler en priorité' },
    DEBORD: { label: 'DÉBORD', icon: '▲', order: 1, title: 'Au-delà de la capacité : excédent en zone de débord' },
    VERT: { label: 'VERT', icon: '✓', order: 2, title: 'Entre mini et maxi' },
    PLEIN: { label: 'PLEIN', icon: '■', order: 3, title: 'Maxi atteint : on n\'appelle plus' }
  };
  var PROG_ORDER = ['A320', 'A321', 'A330'];
  var FLUX_ORDER = ['AMBOISE', 'M5', 'T5X→H5', 'V4'];
  var FLUX_SUB = { 'AMBOISE': 'bâtis via F07', 'M5': 'usinage · séquenceur', 'T5X→H5': 'séquenceur H5', 'V4': '' };
  var FAM_COLORS = { 'A320-C42': '#84BD00', 'A321-C42': '#005587', 'A320-C36': '#E07AAE', 'A321-C36': '#FE5000', 'A330-C40': '#0085AD', 'A330-C47': '#859199' };
  var FAM_LIGHT = { 'A320-C42': true, 'A321-C36': true };

  var DEFAULT_STATE = { prog: ['A320', 'A321'], ver: [], cadre: [], avar: [], cote: [], flux: [], st: [], q: '', sort: 'crit', view: 'buffer', year: '', print: 'A4', filtersOpen: false };
  var S = clone(DEFAULT_STATE);
  var DATA = null, HISTO = null, JOURNAL = null;
  var OPEN = {}, DRAFT = {}, MAP_DRAFT = {};
  var loading = false, tvTimer = null, tvSlide = 0, chart = null, chartJsLoading = null;

  /* ------------------------------------------------------------------ */
  /* Utilitaires                                                         */
  /* ------------------------------------------------------------------ */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function n(v) {
    var x = Math.round((Number(v) || 0) * 10) / 10;
    return x.toLocaleString('fr-FR');
  }
  function pct(v) { return Math.round((v || 0) * 100) + ' %'; }
  function famKey(b) { return b.prog + '-' + b.cadre; }
  function blockName(b) { return b.prog + ' ' + b.version + ' ' + b.bloc; }
  function g(key) { return DATA && DATA.globals ? DATA.globals[key] : null; }
  function photoHours() { return String(g('heures_photo') || '').split(';').join(' et '); }
  function normFlux(f) { return String(f || '').toUpperCase().replace(/\s+/g, '').replace('->', '→'); }

  function run(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
        reject(e && e.message ? e : new Error(String(e)));
      });
      r[fn].apply(r, args);
    });
  }

  var toastTimer = null;
  function toast(msg, isErr) {
    var t = $('#toast');
    t.textContent = msg;
    t.className = 'toast' + (isErr ? ' err' : '');
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, isErr ? 7000 : 3500);
  }

  /* ------------------------------------------------------------------ */
  /* État : URL (google.script.history) + localStorage                   */
  /* ------------------------------------------------------------------ */
  function loadState(cb) {
    var fromLs = null;
    try { fromLs = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { fromLs = null; }
    if (fromLs) Object.keys(DEFAULT_STATE).forEach(function (k) { if (fromLs[k] !== undefined) S[k] = fromLs[k]; });
    var apply = function (p) {
      p = p || {};
      var any = FILTER_KEYS.concat(['q', 'sort', 'view', 'year']).some(function (k) { return p[k] !== undefined; });
      if (any) {
        FILTER_KEYS.forEach(function (k) { S[k] = p[k] !== undefined ? String(p[k]).split(',').filter(Boolean) : clone(DEFAULT_STATE[k]); });
        S.q = p.q || '';
        if (p.sort) S.sort = p.sort;
        if (p.view) S.view = p.view;
        if (p.year) S.year = p.year;
      }
      cb();
    };
    try { google.script.url.getLocation(function (loc) { apply(loc && loc.parameter); }); } catch (e) { apply({}); }
  }

  function saveState() {
    if (TV) return;
    try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { /* stockage indisponible */ }
    var p = {};
    FILTER_KEYS.forEach(function (k) {
      if (JSON.stringify(S[k]) !== JSON.stringify(DEFAULT_STATE[k])) p[k] = S[k].join(',');
    });
    if (S.q) p.q = S.q;
    if (S.sort !== 'crit') p.sort = S.sort;
    if (S.view !== 'buffer') p.view = S.view;
    if (S.year) p.year = S.year;
    try { google.script.history.replace(null, p); } catch (e) { /* hors Apps Script */ }
  }

  /* ------------------------------------------------------------------ */
  /* Chargement                                                          */
  /* ------------------------------------------------------------------ */
  function load(force) {
    if (loading) return;
    loading = true;
    var btn = $('#btn-refresh');
    btn.classList.add('loading'); btn.disabled = true;
    run('getDashboardData', { year: S.year || null, force: !!force }).then(function (d) {
      DATA = d;
      if (!S.year) S.year = d.year;
      loading = false;
      btn.classList.remove('loading'); btn.disabled = false;
      renderAll();
      if (force) toast('Données relues depuis les Google Sheets');
      loadHistory();
    }).catch(function (e) {
      loading = false;
      btn.classList.remove('loading'); btn.disabled = false;
      showFatal(e.message);
    });
  }

  function loadHistory() {
    run('getHistoryData', 90).then(function (h) {
      HISTO = h;
      if (S.view === 'histo') renderHisto();
      if (DATA) DATA.blocks.forEach(function (b) { var el = $('#spark-' + cssId(b.id)); if (el) el.innerHTML = sparkDetail(b.id); });
    }).catch(function () { HISTO = { kpi: {}, blocks: {}, error: true }; });
  }

  function showFatal(msg) {
    var hint = /setup\(\)/.test(msg) ? 'Un administrateur doit lancer setup() dans l\'éditeur Apps Script (voir README).'
      : /Pas d'accès/.test(msg) ? 'Vérifiez que le compte qui déploie la web app a accès en lecture au fichier.'
      : /introuvable/.test(msg) ? 'L\'onglet a peut-être été renommé ou supprimé dans le Google Sheet source.'
      : 'Réessayez dans un instant. Si le problème persiste, contactez le pilote du buffer.';
    $('#view-buffer').hidden = false;
    $('#view-buffer').innerHTML = '<div class="error-box" role="alert"><b>Impossible de charger le buffer</b>' +
      '<p>' + esc(msg) + '</p><p>' + esc(hint) + '</p><button type="button" class="btn" id="btn-retry">Réessayer</button></div>';
    $('#btn-retry').onclick = function () { load(true); };
    $('#kpis').innerHTML = '';
    $('#stamp').textContent = 'Données indisponibles';
  }

  /* ------------------------------------------------------------------ */
  /* Filtres et KPI                                                      */
  /* ------------------------------------------------------------------ */
  function matches(b, skipKey) {
    if (skipKey !== 'prog' && S.prog.length && S.prog.indexOf(b.prog) < 0) return false;
    if (skipKey !== 'ver' && S.ver.length && S.ver.indexOf(b.version) < 0 &&
      !b.refs.some(function (r) { return r.versionRef && S.ver.indexOf(r.versionRef) >= 0; })) return false;
    if (skipKey !== 'cadre' && S.cadre.length && S.cadre.indexOf(b.cadre) < 0) return false;
    if (skipKey !== 'avar' && S.avar.length && S.avar.indexOf(b.avar) < 0) return false;
    if (skipKey !== 'cote' && S.cote.length && S.cote.indexOf(b.cote) < 0) return false;
    if (skipKey !== 'flux' && S.flux.length && S.flux.indexOf(b.flux) < 0) return false;
    if (skipKey !== 'st' && S.st.length && S.st.indexOf(b.status) < 0) return false;
    if (S.q) {
      var hay = [b.prog, b.version, b.bloc, b.flux, b.l1Designation].concat(b.refs.map(function (r) { return r.ref + ' ' + r.designation; }))
        .concat(b.ofs.map(function (o) { return o.of + ' ' + o.serie; })).join(' ').toLowerCase();
      var terms = S.q.toLowerCase().split(/\s+/).filter(Boolean);
      if (!terms.every(function (t) { return hay.indexOf(t) >= 0; })) return false;
    }
    return true;
  }
  function filtered() { return DATA ? DATA.blocks.filter(function (b) { return matches(b); }) : []; }

  /**
   * Une ligne = un rack physique (calculé côté serveur) : les variantes d'un même bloc (A321 ACF + XLR,
   * A330 NEO + CEO) partagent la place. Capacité / mini / maxi du rack = somme des variantes,
   * statut et débord calculés sur le rack. Un rack est affiché dès qu'une de ses variantes passe les filtres.
   */
  function rackById(id) { return (DATA.racks || []).filter(function (r) { return r.id === id; })[0]; }
  function groupsOf(blocks) {
    var seen = {}, out = [];
    blocks.forEach(function (b) {
      if (seen[b.rackId]) return;
      seen[b.rackId] = true;
      var r = rackById(b.rackId);
      if (!r) return;
      var gr = Object.assign({}, r);
      gr.variants = DATA.blocks.filter(function (x) { return x.rackId === r.id; }).sort(function (a, c) { return a.order - c.order; });
      out.push(gr);
    });
    return out;
  }
  function groupName(gr) { return gr.label || (gr.prog + ' ' + gr.bloc); }
  function groupIdOf(blockId) { var b = blockById(blockId); return b ? b.rackId : blockId; }

  function kpisOf(blocks) {
    var k = { blocks: blocks.length, aju: 0, cap: 0, avenir: 0, debord: 0, oldest: null, ageAlert: 0 };
    var grs = groupsOf(blocks);
    grs.forEach(function (gr) {
      k.aju += gr.aju; k.cap += gr.cap; k.avenir += gr.avenir; k.debord += gr.excess;
      gr.variants.forEach(function (b) {
        if (b.aju > 0 && (!k.oldest || b.ageMax > k.oldest.age)) k.oldest = { age: b.ageMax, blockId: b.id, label: blockName(b) };
      });
    });
    k.rows = grs.length;
    k.rougeRows = grs.filter(function (gr) { return gr.status === 'ROUGE'; });
    k.rouge = k.rougeRows.length;
    k.plein = grs.filter(function (gr) { return gr.status === 'PLEIN'; }).length;
    k.ageAlert = grs.filter(function (gr) { return gr.ageMax > g('age_seuil_jours'); }).length;
    k.fill = k.cap > 0 ? k.aju / k.cap : 0;
    return k;
  }

  function debordLevel(count, cap) {
    var r = cap > 0 ? count / cap * 100 : (count > 0 ? 999 : 0);
    if (r > 100) return { key: 'sature', label: 'Saturé', r: r };
    if (r > g('debord_seuil_escalade')) return { key: 'escalade', label: 'Escalade', r: r };
    if (r > g('debord_seuil_vigilance')) return { key: 'vigilance', label: 'Vigilance', r: r };
    return { key: 'normal', label: 'Normal', r: r };
  }

  /* ------------------------------------------------------------------ */
  /* Rendu global                                                        */
  /* ------------------------------------------------------------------ */
  function renderAll() {
    if (!DATA) return;
    renderHeader();
    renderAlerts();
    renderKpis();
    renderFilters();
    renderTabs();
    renderView();
    renderFooter();
    saveState();
  }

  function renderView() {
    ['buffer', 'debord', 'histo', 'params'].forEach(function (v) { $('#view-' + v).hidden = S.view !== v; });
    $('#filters').hidden = !S.filtersOpen || S.view === 'params';
    $('#btn-filters').hidden = S.view === 'params';
    $('#btn-filters').setAttribute('aria-expanded', String(!!S.filtersOpen && S.view !== 'params'));
    if (S.view === 'buffer') renderBuffer();
    else if (S.view === 'debord') renderDebord();
    else if (S.view === 'histo') renderHisto();
    else if (S.view === 'params') renderParams();
    $('#btn-mass').disabled = S.view !== 'buffer' || !filtered().length;
    $('#btn-mass').textContent = '✎ Modifier mini / maxi des ' + filtered().length + ' blocs affichés';
  }

  /** Résumé des filtres actifs, affiché à côté du bouton « Filtres ». */
  function filterSummary() {
    var parts = [];
    if (JSON.stringify(S.prog) !== JSON.stringify(DEFAULT_STATE.prog)) parts.push(S.prog.length ? S.prog.join(' + ') : 'tous programmes');
    ['ver', 'cadre', 'avar', 'flux'].forEach(function (k) { if (S[k].length) parts.push(S[k].join(' + ')); });
    if (S.cote.length) parts.push(S.cote.map(function (c) { return c === 'D' ? 'Droit' : 'Gauche'; }).join(' + '));
    if (S.st.length) parts.push(S.st.map(function (s) { return STATUS[s].label; }).join(' + '));
    if (S.q) parts.push('« ' + S.q + ' »');
    return parts;
  }
  function renderFilterButton() {
    if (TV) return;
    var parts = filterSummary();
    $('#filter-count').textContent = parts.length ? parts.length : '';
    $('#filter-count').hidden = !parts.length;
    $('#filter-summary').innerHTML = parts.length
      ? esc(parts.join(' · ')) + ' <button type="button" class="linkish" data-act="reset-filters">effacer</button>'
      : '<span class="muted">A320 + A321 · tous les blocs</span>';
  }

  function renderHeader() {
    var e = DATA.extraction || {};
    $('#stamp').innerHTML = 'Données SAP du <b>' + esc(e.date || '?') + '</b> à <b>' + esc(e.time || '?') + '</b>' +
      ' <span class="cache-tag">· calculé le ' + esc(DATA.generatedAt) + (DATA.fromCache ? ' (cache)' : '') + '</span>';
    $('#print-stamp').textContent = 'Données SAP du ' + (e.date || '?') + ' à ' + (e.time || '?') + ' · imprimé le ' + new Date().toLocaleString('fr-FR');
    var sel = $('#year');
    sel.innerHTML = DATA.years.map(function (y) {
      return '<option value="' + esc(y.key) + '"' + (y.key === DATA.year ? ' selected' : '') + '>' + esc(y.label) + (y.key === g('annee_l1') ? ' (défaut)' : '') + '</option>';
    }).join('');
    $('#print-size').value = S.print || 'A4';
  }

  function renderAlerts() {
    var html = '';
    var um = DATA.unmapped || [];
    if (um.length) {
      var pcs = um.reduce(function (a, u) { return a + u.aju + u.avenir; }, 0);
      html += '<div class="alert alert-unmapped" role="alert"><span>⚠ ' + um.length + ' réf' + (um.length > 1 ? 's' : '') + ' non rattachée' + (um.length > 1 ? 's' : '') +
        ' (' + n(pcs) + ' pièce' + (pcs > 1 ? 's' : '') + ' comptées nulle part)</span>' +
        (TV ? '' : '<button type="button" class="btn btn-small" data-act="unmapped">Rattacher à un bloc</button>') + '</div>';
    }
    // Seules les erreurs bloquantes restent en bandeau ; les messages de contrôle sont dans l'onglet Réglages
    (DATA.warnings || []).filter(function (x) { return x.level === 'error'; }).forEach(function (x) {
      html += '<div class="alert alert-error" role="alert">✖ ' + esc(x.msg) + '</div>';
    });
    $('#alerts').innerHTML = html;
  }

  /**
   * 5 indicateurs, lisibles de loin : ce qu'il faut appeler (ROUGE), la place (Débord),
   * le niveau global, ce qui arrive (À venir), le FIFO (plus ancienne).
   */
  function renderKpis() {
    var blocks = filtered();
    if (TV) blocks = DATA.blocks.filter(function (b) { return tvProgs().indexOf(b.prog) >= 0; });
    var k = kpisOf(blocks);
    var cap = g('debord_capacite');
    var debTotal = DATA.debord.total;
    var lvl = debordLevel(debTotal, cap);
    var html = '';

    var names = k.rougeRows.map(groupName);
    var rougeSub = !names.length ? 'aucun bloc à appeler' : esc(names.slice(0, 3).join(', ')) + (names.length > 3 ? ' +' + (names.length - 3) : '');
    html += kpiBtn('k-rouge' + (S.st.length === 1 && S.st[0] === 'ROUGE' ? ' active' : ''), 'st:ROUGE', '▼ À appeler (ROUGE)', k.rouge, rougeSub);

    html += kpiBtn('k-debord k-lvl-' + lvl.key, 'view:debord', 'Débord', n(debTotal) + '<small> / ' + n(cap) + '</small>',
      '<div class="minibar"><span class="mb-' + lvl.key + '" style="width:' + Math.min(100, lvl.r) + '%"></span></div><span class="lvl lvl-' + lvl.key + '">' + lvl.label + '</span>');

    html += '<div class="kpi" title="Pièces AJU / somme des capacités des blocs affichés"><span class="kpi-label">Remplissage AJU</span>' +
      '<span class="kpi-value">' + pct(k.fill) + '</span><div class="minibar"><span style="width:' + Math.min(100, k.fill * 100) + '%"></span></div>' +
      '<span class="kpi-sub">' + n(k.aju) + ' / ' + n(k.cap) + ' pcs' + (k.plein ? ' · ' + k.plein + ' plein' + (k.plein > 1 ? 's' : '') : '') + '</span></div>';

    html += '<div class="kpi k-avenir"><span class="kpi-label">À venir</span><span class="kpi-value">' + n(k.avenir) + '<small> pcs</small></span>' +
      '<span class="kpi-sub">en entrée buffer, pas encore en AJU</span></div>';

    html += kpiBtn('k-age' + (k.oldest && k.oldest.age > g('age_seuil_jours') ? ' k-age-alert' : ''), k.oldest ? 'open:' + k.oldest.blockId : '', 'Plus ancienne', k.oldest ? n(k.oldest.age) + '<small> j</small>' : '–',
      k.oldest ? esc(k.oldest.label) : 'aucune pièce en AJU');

    var um = DATA.unmapped || [];
    if (um.length) {
      var pcs = um.reduce(function (a, u) { return a + u.aju + u.avenir; }, 0);
      html += kpiBtn('k-unmapped', 'unmapped', '⚠ Non rattachées', um.length, n(pcs) + ' pièce' + (pcs > 1 ? 's' : '') + ' hors blocs');
    }
    $('#kpis').innerHTML = html;
  }
  function kpiBtn(cls, act, label, value, sub) {
    var tag = act && !TV ? 'button type="button" data-act="' + esc(act) + '"' : 'div';
    return '<' + tag + ' class="kpi ' + cls + '"><span class="kpi-label">' + label + '</span><span class="kpi-value">' + value +
      '</span><span class="kpi-sub">' + sub + '</span></' + (tag === 'div' ? 'div' : 'button') + '>';
  }

  function uniq(arr) { return arr.filter(function (v, i) { return v && arr.indexOf(v) === i; }); }

  function renderFilters() {
    if (TV) return;
    var all = DATA.blocks;
    var vers = uniq(all.map(function (b) { return b.version; }).concat([].concat.apply([], all.map(function (b) { return b.refs.map(function (r) { return r.versionRef; }); }))));
    var groups = [
      { key: 'prog', label: 'Programme', opts: uniq(PROG_ORDER.concat(all.map(function (b) { return b.prog; }))) },
      { key: 'ver', label: 'Version', opts: vers },
      { key: 'cadre', label: 'Cadre', opts: uniq(all.map(function (b) { return b.cadre; })).sort() },
      { key: 'avar', label: 'AV / AR', opts: ['AV', 'AR'] },
      { key: 'cote', label: 'Côté', opts: ['D', 'G'] },
      { key: 'flux', label: 'Flux', opts: uniq(all.map(function (b) { return b.flux; })).sort(function (a, b) { return fluxRank(a) - fluxRank(b); }) },
      { key: 'st', label: 'Statut', opts: ['ROUGE', 'VERT', 'PLEIN', 'DEBORD'] }
    ];
    var html = groups.map(function (gr) {
      return '<div class="fgroup" role="group" aria-label="' + gr.label + '"><span class="fgroup-label">' + gr.label + '</span>' +
        gr.opts.map(function (o) {
          var on = S[gr.key].indexOf(o) >= 0;
          var cnt = DATA.blocks.filter(function (b) {
            return matches(b, gr.key) && (gr.key === 'ver' ? (b.version === o || b.refs.some(function (r) { return r.versionRef === o; })) : blockVal(b, gr.key) === o);
          }).length;
          var lab = gr.key === 'st' ? STATUS[o].icon + ' ' + STATUS[o].label : (gr.key === 'cote' ? (o === 'D' ? 'Droit' : 'Gauche') : o);
          return '<button type="button" class="chip' + (gr.key === 'st' ? ' st-' + o : '') + '" aria-pressed="' + on + '" data-f="' + gr.key + '" data-v="' + esc(o) + '">' +
            esc(lab) + '<span class="n">' + cnt + '</span></button>';
        }).join('') + '</div>';
    }).join('');
    html += '<div class="search"><input type="search" id="q" placeholder="Rechercher une réf, une désignation, un OF…" value="' + esc(S.q) + '" aria-label="Recherche libre">' +
      '<label class="sort-select"><span>Tri</span><select id="sort" aria-label="Tri des blocs">' +
      [['crit', 'Criticité'], ['bloc', 'Bloc'], ['fill-asc', 'Remplissage ↑'], ['fill-desc', 'Remplissage ↓']].map(function (o) {
        return '<option value="' + o[0] + '"' + (S.sort === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
      }).join('') + '</select></label>' +
      '<button type="button" class="linkish" data-act="reset-filters">Réinitialiser</button></div>';
    $('#filters').innerHTML = html;
    renderFilterButton();
  }
  function blockVal(b, key) { return { prog: b.prog, cadre: b.cadre, avar: b.avar, cote: b.cote, flux: b.flux, st: b.status }[key]; }
  function fluxRank(f) { var i = FLUX_ORDER.indexOf(normFlux(f)); return i < 0 ? 99 : i; }

  function renderTabs() {
    $all('.tab').forEach(function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-view') === S.view)); });
  }

  function renderFooter() {
    var parts = [];
    if (DATA.user) parts.push('Connecté : ' + esc(DATA.user));
    if (!TV && DATA.paramsUrl) parts.push('<a href="' + esc(DATA.paramsUrl) + '" target="_blank" rel="noopener">Classeur Paramètres</a>');
    parts.push(DATA.stats.piecesRows + ' lignes ZZ84 aux postes BUFFER / AJU');
    var nw = (DATA.warnings || []).filter(function (x) { return x.level !== 'error'; }).length;
    if (nw && !TV) parts.push('<button type="button" class="linkish" data-act="view:params">ⓘ ' + nw + ' message' + (nw > 1 ? 's' : '') + ' de contrôle des données</button>');
    $('#foot-left').innerHTML = parts.join(' · ');
    var f = [];
    FILTER_KEYS.forEach(function (k) { if (S[k].length) f.push(k + ' = ' + S[k].join('/')); });
    if (S.q) f.push('recherche « ' + S.q + ' »');
    $('#print-filters').textContent = f.length ? 'Filtres : ' + f.join(' · ') : 'Tous les blocs';
  }

  /* ------------------------------------------------------------------ */
  /* Vue Buffer                                                          */
  /* ------------------------------------------------------------------ */
  function sortGroups(list) {
    var cmp;
    if (S.sort === 'bloc') {
      cmp = function (a, b) {
        return a.cadre.localeCompare(b.cadre) || (a.avar === b.avar ? 0 : a.avar === 'AV' ? -1 : 1) ||
          (a.cote === b.cote ? 0 : a.cote === 'D' ? -1 : 1);
      };
    } else if (S.sort === 'fill-asc' || S.sort === 'fill-desc') {
      var sgn = S.sort === 'fill-asc' ? 1 : -1;
      cmp = function (a, b) { return sgn * (a.fill - b.fill) || a.order - b.order; };
    } else {
      cmp = function (a, b) {
        var d = STATUS[a.status].order - STATUS[b.status].order;
        if (d) return d;
        if (a.status === 'ROUGE') return (a.mini ? a.aju / a.mini : 1) - (b.mini ? b.aju / b.mini : 1) || a.order - b.order;
        if (a.status === 'DEBORD') return b.excess - a.excess || a.order - b.order;
        return a.fill - b.fill || a.order - b.order;
      };
    }
    return list.slice().sort(cmp);
  }

  function renderBuffer(progOverride) {
    var root = $('#view-buffer');
    var list = filtered();
    if (progOverride) list = DATA.blocks.filter(function (b) { return progOverride.indexOf(b.prog) >= 0 && matches(b, 'prog'); });
    if (!list.length) {
      root.innerHTML = '<div class="empty"><b>Aucun bloc ne correspond aux filtres</b>' +
        '<button type="button" class="linkish" data-act="reset-filters">Réinitialiser les filtres</button>' +
        (S.prog.indexOf('A330') < 0 && !TV ? '<br>Les blocs A330 sont masqués par défaut (Filtres → A330).' : '') + '</div>';
      return;
    }
    var html = '';
    PROG_ORDER.concat(uniq(list.map(function (b) { return b.prog; })).filter(function (p) { return PROG_ORDER.indexOf(p) < 0; })).forEach(function (p) {
      var pl = list.filter(function (b) { return b.prog === p; });
      if (!pl.length) return;
      var k = kpisOf(pl);
      var grs = groupsOf(pl);
      html += '<div class="band"><span>' + esc(p) + '</span><span class="band-sub">AJU <b>' + n(k.aju) + '</b> / ' + n(k.cap) + ' pcs · ' +
        (k.rouge ? '<b>' + k.rouge + '</b> à appeler' : 'aucun rouge') + (k.debord ? ' · débord <b>+' + n(k.debord) + '</b>' : '') + '</span></div>';
      html += '<div class="col-heads" aria-hidden="true"><span>À venir</span><span>Bloc</span>' +
        '<span>Niveau · une case = une pièce <i class="lg lg-min"></i>mini <i class="lg lg-max"></i>maxi <i class="lg lg-proj"></i>à venir</span>' +
        '<span>AJU</span><span>Débord</span><span>Âge</span></div>';
      var fluxes = uniq(grs.map(function (gr) { return gr.flux; })).sort(function (a, b) { return fluxRank(a) - fluxRank(b); });
      fluxes.forEach(function (f) {
        html += '<div class="flux-head">' + esc(f) + ' <span>' + esc(FLUX_SUB[normFlux(f)] || '') + '</span></div>';
        sortGroups(grs.filter(function (gr) { return gr.flux === f; })).forEach(function (gr) { html += rowHtml(gr); });
      });
    });
    root.innerHTML = html;
  }

  function cssId(id) { return String(id).replace(/[^A-Za-z0-9_-]/g, '_'); }

  function statusPills(statuses) {
    return statuses.map(function (s) { return '<span class="st-pill ' + s + '" title="' + esc(STATUS[s].title) + '">' + STATUS[s].icon + ' ' + STATUS[s].label + '</span>'; }).join('');
  }

  function rowHtml(gr) {
    var open = !!OPEN[gr.id] && !TV;
    var shared = gr.variants.length > 1;
    var ageAlert = gr.ageMax > g('age_seuil_jours');
    var st = STATUS[gr.status];
    var tip = groupName(gr) + ' : ' + st.label + ' · AJU ' + n(gr.aju) + ' / ' + gr.cap + ' (mini ' + gr.mini + ', maxi ' + gr.maxi + ') · à venir ' + n(gr.avenir) +
      (shared ? '\nRack partagé : ' + gr.variants.map(function (b) { return b.version + ' ' + n(b.aju) + ' pcs (capacité ' + b.cap + ')'; }).join(' + ') : '');
    var h = '<div class="row st-' + gr.status + '" id="row-' + cssId(gr.id) + '" data-id="' + esc(gr.id) + '" role="button" tabindex="0" aria-expanded="' + open + '" title="' + esc(tip) + '">';
    h += '<span class="fam fam-' + gr.prog + '-' + gr.cadre + '" aria-hidden="true"></span>';
    h += '<div class="c-av"><span class="avenir' + (gr.avenir ? '' : ' zero') + '" aria-label="' + n(gr.avenir) + ' pièces à venir"><b>' + n(gr.avenir) + '</b><small>à venir</small></span></div>';
    h += '<div class="c-name"><div class="bname">' + esc(gr.bloc) + '</div><div class="meta">' + statusPills([gr.status]) +
      '<span class="ver">' + esc(gr.variants.map(function (b) { return b.version; }).join(' + ')) + '</span></div></div>';
    h += '<div class="c-gauge' + (shared ? ' multi' : '') + '">' + rackGauge(gr, shared) + '</div>';
    h += '<div class="c-lvl"><b>' + n(gr.aju) + '</b><small>/ ' + gr.cap + '</small></div>';
    h += '<div class="c-deb">' + (gr.excess > 0 ? '<span class="deb" aria-label="' + gr.excess + ' pièces en débord"><b>+' + n(gr.excess) + '</b></span>' : '<span class="deb-none" aria-label="pas de débord">–</span>') + '</div>';
    h += '<div class="c-age">' + (gr.aju > 0 ? (ageAlert ? '<span class="age-badge" title="Pièce au poste depuis plus de ' + g('age_seuil_jours') + ' j">' + n(gr.ageMax) + ' j</span>' : n(gr.ageMax) + ' j') : '<span class="deb-none">–</span>') + '</div>';
    h += '<span class="chev no-tv" aria-hidden="true">▶</span></div>';
    if (open) h += detailHtml(gr);
    return h;
  }

  /** Une seule piste pour le rack (place partagée), une case par pièce ; la répartition par variante est indiquée au-dessus. */
  function rackGauge(gr, shared) {
    var cap = gr.cap;
    var label = groupName(gr) + ' : AJU ' + n(gr.aju) + ' sur capacité ' + cap + ', mini ' + gr.mini + ', maxi ' + gr.maxi + ', à venir ' + n(gr.avenir);
    var head = shared ? '<span class="seg-label">rack partagé · ' + gr.variants.map(function (b) { return esc(b.version) + ' <b>' + n(b.aju) + '</b>'; }).join(' + ') + '</span>' : '';
    if (cap <= 0) {
      return '<div class="seg st-' + gr.status + '">' + head + '<div class="gauge-zero" role="img" aria-label="' + esc(label) + '">capacité 0</div></div>';
    }
    var cells = '';
    var aju = Math.min(Math.round(gr.aju), cap), proj = Math.min(Math.round(gr.projection), cap);
    for (var i = 0; i < cap; i++) cells += '<span class="cell' + (i < aju ? ' on' : (i < proj ? ' proj' : '')) + '"></span>';
    var marks = '';
    if (gr.mini > 0) marks += '<span class="mark mini" style="left:calc(' + (gr.mini / cap * 100) + '% - ' + (gr.mini / cap * 3) + 'px)"></span>';
    if (gr.maxi > 0 && gr.maxi < cap) marks += '<span class="mark maxi" style="left:calc(' + (gr.maxi / cap * 100) + '% - ' + (gr.maxi / cap * 3) + 'px)"></span>';
    return '<div class="seg st-' + gr.status + (gr.maxi >= cap ? ' max-at-end' : '') + '">' + head +
      '<div class="gauge" style="--cap:' + cap + '" role="img" aria-label="' + esc(label) + '">' + cells + marks + '</div></div>';
  }

  function detailHtml(gr) {
    var shared = gr.variants.length > 1;
    var h = '<div class="detail" id="det-' + cssId(gr.id) + '">';
    if (shared) {
      var sum = function (f) { return gr.variants.map(function (b) { return b[f]; }).join(' + '); };
      h += '<div class="rack-sum"><b>Rack partagé ' + esc(gr.variants.map(function (b) { return b.version; }).join(' + ')) + '</b>' +
        '<span>capacité <b>' + gr.cap + '</b> = ' + sum('cap') + '</span><span>mini <b>' + gr.mini + '</b> = ' + sum('mini') + '</span>' +
        '<span>maxi <b>' + gr.maxi + '</b> = ' + sum('maxi') + '</span>' +
        '<span class="muted">Les réglages de chaque variante s\'additionnent pour former ceux du rack.</span></div>';
    }
    gr.variants.forEach(function (b) {
      h += '<section class="variant">';
      h += '<div class="variant-head"><b>' + esc(blockName(b)) + '</b>' + (shared ? '' : statusPills([b.status])) +
        '<span>AJU <b>' + n(b.aju) + '</b>' + (shared ? ' · part de capacité ' : ' / ') + b.cap + ' · mini ' + b.mini + ' · maxi ' + b.maxi + '</span>' +
        '<span>à venir <b>' + n(b.avenir) + '</b></span>' +
        '<span class="muted">' + esc(b.flux) + (b.ppe > 1 ? ' · ' + b.ppe + ' pcs / emplacement' : '') + '</span></div>';
      h += '<div class="variant-body">' + refsHtml(b) + ofsHtml(b) + (TV ? '' : settingsHtml(b)) + '</div>';
      h += '</section>';
    });
    return h + '</div>';
  }

  function refsHtml(b) {
    return '<div><h3>Réfs du bloc</h3><div class="scroll" style="max-height:none"><table class="tbl"><thead><tr><th>Réf</th><th>Type</th><th>Désignation</th><th class="num">AJU</th><th class="num">À venir</th></tr></thead><tbody>' +
      b.refs.map(function (r) {
        return '<tr><td class="mono">' + esc(r.ref) + '</td><td><span class="type-tag ' + esc(r.type) + '">' + esc(r.type) + '</span>' +
          (r.versionRef ? ' <span class="type-tag">' + esc(r.versionRef) + '</span>' : '') +
          (r.aValider ? ' <span class="warn-pill" title="' + esc(r.comment || 'Rattachement à valider') + '">à valider</span>' : '') + '</td>' +
          '<td>' + esc(r.designation || '–') + '</td><td class="num">' + n(r.aju) + '</td><td class="num">' + n(r.avenir) + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="spark-box"><h3>Évolution AJU</h3><div id="spark-' + cssId(b.id) + '">' + sparkDetail(b.id) + '</div></div></div>';
  }

  function ofsHtml(b) {
    return '<div><h3>Ordres de fabrication (' + b.ofs.length + ')</h3>' + (b.ofs.length ? '<div class="scroll"><table class="tbl"><thead><tr><th>N° OF</th><th>Réf</th><th class="num">Qté</th><th class="num">Âge</th><th>Opér.</th><th>N° série</th><th>Statut</th></tr></thead><tbody>' +
      b.ofs.map(function (o) {
        var old = o.statut === 'AJU' && o.age > g('age_seuil_jours');
        return '<tr><td class="mono">' + esc(o.of) + '</td><td class="mono">' + esc(o.ref) + '</td><td class="num">' + n(o.qte) + '</td>' +
          '<td class="num">' + (old ? '<span class="age-badge">' + n(o.age) + ' j</span>' : n(o.age) + ' j') + '</td><td>' + esc(o.oper) + '</td><td>' + esc(o.serie) + '</td>' +
          '<td>' + (o.statut === 'AJU' ? '<span class="tag-aju">AJU</span>' : '<span class="tag-avenir">À venir</span>') + ' <small>' + esc(o.poste) + '</small></td></tr>';
      }).join('') + '</tbody></table></div>' : '<p class="deb-none">Aucun OF aux postes BUFFER / AJU.</p>') + '</div>';
  }

  /* --- Réglages d'un bloc (stepper + validation) --- */
  function draftOf(b) {
    if (!DRAFT[b.id]) DRAFT[b.id] = { cap: b.cap, maxi: b.maxi, mini: b.mini, unit: b.overrides.unit ? b.unit : '', touched: {} };
    return DRAFT[b.id];
  }
  function defaultsFor(b, d) {
    var unit = d.unit || g('unite');
    var capDef = Math.round((b.l1Value || 0) * (unit === 'emplacements' ? b.ppe : 1));
    var cap = d.touched.cap || b.overrides.cap ? d.cap : capDef;
    var maxiDef = cap;
    var maxi = d.touched.maxi || b.overrides.maxi ? d.maxi : maxiDef;
    var miniDef = cap > 0 ? Math.min(Math.max(1, Math.ceil(g('mini_pct') / 100 * cap)), maxi) : 0;
    return { capDef: capDef, maxiDef: maxiDef, miniDef: miniDef, cap: cap, maxi: maxi, mini: d.touched.mini || b.overrides.mini ? d.mini : miniDef };
  }
  function settingsHtml(b) {
    var d = draftOf(b), v = defaultsFor(b, d);
    d.cap = v.cap; d.maxi = v.maxi; d.mini = v.mini;
    var err = !(v.mini >= 0 && v.mini <= v.maxi && v.maxi <= v.cap) ? 'Contrôle : 0 ≤ mini ≤ maxi ≤ capacité' : '';
    var f = function (key, label, val, def, over) {
      return '<div class="field"><label for="ed-' + cssId(b.id) + '-' + key + '">' + label + '</label><div class="stepper">' +
        '<button type="button" data-step="-1" data-k="' + key + '" aria-label="' + label + ' moins un">−</button>' +
        '<input type="number" min="0" step="1" inputmode="numeric" id="ed-' + cssId(b.id) + '-' + key + '" data-k="' + key + '" value="' + val + '">' +
        '<button type="button" data-step="1" data-k="' + key + '" aria-label="' + label + ' plus un">+</button></div>' +
        '<span class="hint' + (val !== def ? ' over' : '') + '">' + (val !== def ? 'surchargé · défaut ' + def : 'valeur par défaut') + '</span></div>';
    };
    var unitSel = '<div class="field"><label for="ed-' + cssId(b.id) + '-unit">Unité L1</label><select id="ed-' + cssId(b.id) + '-unit" data-k="unit">' +
      '<option value=""' + (!d.unit ? ' selected' : '') + '>Globale (' + (g('unite') === 'emplacements' ? 'emplacements' : 'pièces') + ')</option>' +
      '<option value="pieces"' + (d.unit === 'pieces' ? ' selected' : '') + '>Pièces</option>' +
      '<option value="emplacements"' + (d.unit === 'emplacements' ? ' selected' : '') + '>Emplacements</option></select>' +
      '<span class="hint">L1 ' + esc(DATA.year) + ' : ' + (b.l1Value === null ? 'réf absente' : n(b.l1Value)) + ' · ' + b.ppe + ' pc/empl. (' + (b.avar || 'AV') + ')</span></div>';
    return '<div class="settings" data-id="' + esc(b.id) + '"><h3>Réglages du bloc (partagés)</h3>' +
      f('cap', 'Capacité', v.cap, v.capDef) + f('maxi', 'Maxi', v.maxi, v.maxiDef) + f('mini', 'Mini', v.mini, v.miniDef) + unitSel +
      '<div class="form-err" role="alert">' + err + '</div>' +
      '<div class="actions"><button type="button" class="btn" data-act="save-block"' + (err ? ' disabled' : '') + '>Enregistrer</button>' +
      '<button type="button" class="btn btn-ghost" data-act="reset-block">Réinitialiser aux valeurs L1</button></div>' +
      '<p class="hint" style="font-size:.7rem;color:var(--muted);margin:.4rem 0 0">Valeurs en pièces. Équivalent : ' + n(v.cap / b.ppe) + ' emplacements.</p></div>';
  }

  function refreshSettings(id) {
    var b = blockById(id);
    var box = $('.settings[data-id="' + id + '"]');
    if (!b || !box) return;
    var tmp = document.createElement('div');
    tmp.innerHTML = settingsHtml(b);
    var focusK = document.activeElement && document.activeElement.getAttribute('data-k');
    box.parentNode.replaceChild(tmp.firstChild, box);
    if (focusK) { var el = $('#ed-' + cssId(id) + '-' + focusK); if (el) { el.focus(); if (el.select) try { el.select(); } catch (e) { /* */ } } }
  }

  function blockById(id) { return DATA.blocks.filter(function (b) { return b.id === id; })[0]; }

  function saveBlock(id) {
    var b = blockById(id), d = draftOf(b), v = defaultsFor(b, d);
    var change = { blockId: id };
    if (d.touched.cap || b.overrides.cap) change.cap = v.cap === v.capDef ? null : v.cap;
    if (d.touched.maxi || b.overrides.maxi) change.maxi = v.maxi === v.maxiDef ? null : v.maxi;
    if (d.touched.mini || b.overrides.mini) change.mini = v.mini === v.miniDef ? null : v.mini;
    change.unit = d.unit || null;
    submitBlocks([change]);
  }

  function submitBlocks(changes, after) {
    toast('Enregistrement…');
    return run('saveBlockParams', changes).then(function (res) {
      changes.forEach(function (c) { if (res.saved.indexOf(c.blockId) >= 0) delete DRAFT[c.blockId]; });
      if (res.errors.length) toast(res.errors.length + ' bloc(s) refusé(s) : ' + res.errors.map(function (e) { return e.message; }).join(' ; '), true);
      else toast(res.saved.length + ' bloc' + (res.saved.length > 1 ? 's' : '') + ' enregistré' + (res.saved.length > 1 ? 's' : '') + ' (partagé avec tous les utilisateurs)');
      if (after) after(res);
      load();
    }).catch(function (e) { toast(e.message, true); });
  }

  /* ------------------------------------------------------------------ */
  /* Sparklines (SVG)                                                    */
  /* ------------------------------------------------------------------ */
  function sparkSvg(id, w, h, withLimits) {
    var pts = HISTO && HISTO.blocks && HISTO.blocks[id];
    if (!pts || pts.length < 2) return '';
    var b = blockById(id) || { mini: 0, maxi: 0, cap: 0 };
    var vals = pts.map(function (p) { return p.aju; });
    var max = Math.max.apply(null, vals.concat([b.cap, 1]));
    var x = function (i) { return (i / (pts.length - 1)) * (w - 2) + 1; };
    var y = function (v) { return h - 1 - (v / max) * (h - 2); };
    var line = vals.map(function (v, i) { return x(i).toFixed(1) + ',' + y(v).toFixed(1); }).join(' ');
    var lim = withLimits ? '<line x1="0" x2="' + w + '" y1="' + y(b.mini) + '" y2="' + y(b.mini) + '" stroke="#E4002B" stroke-dasharray="3 2" stroke-width="1"/>' +
      '<line x1="0" x2="' + w + '" y1="' + y(b.maxi) + '" y2="' + y(b.maxi) + '" stroke="#4E7A00" stroke-dasharray="3 2" stroke-width="1"/>' : '';
    return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Évolution AJU sur ' + pts.length + ' photos">' + lim +
      '<polyline points="' + line + '" fill="none" stroke="#0085AD" stroke-width="1.6"/>' +
      '<circle cx="' + x(vals.length - 1) + '" cy="' + y(vals[vals.length - 1]) + '" r="2" fill="#00205B"/></svg>';
  }
  function sparkDetail(id) {
    if (!HISTO) return '<span class="spark-empty">Chargement de l\'historique…</span>';
    var s = sparkSvg(id, 240, 48, true);
    return s || '<span class="spark-empty">Pas encore assez de photos (déclencheur à ' + esc(photoHours()) + ').</span>';
  }

  /* ------------------------------------------------------------------ */
  /* Vue Débord                                                          */
  /* ------------------------------------------------------------------ */
  function renderDebord() {
    var root = $('#view-debord');
    var cap = g('debord_capacite');
    var pieces = DATA.debord.pieces;
    var vis = {};
    filtered().forEach(function (b) { vis[b.id] = true; });
    var selCount = pieces.filter(function (p) { return vis[p.blockId]; }).length;
    var lvl = debordLevel(pieces.length, cap);
    var meta = (DATA.globalsMeta || {}).debord_capacite || {};
    var html = '<div class="band"><span>ZONE DE DÉBORD</span><span class="band-sub">' + n(cap) + ' places · une pastille = une pièce, couleur de la famille · premier arrivé, premier repris</span></div>';
    html += '<div class="deb-head"><div><div class="deb-big">' + n(pieces.length) + '<small> / ' + n(cap) + '</small></div>' +
      '<span class="lvl lvl-' + lvl.key + '">' + lvl.label + ' · ' + Math.round(lvl.r) + ' %</span></div>' +
      '<div class="deb-legend">Seuils : ≤ ' + g('debord_seuil_vigilance') + ' % normal · ' + g('debord_seuil_vigilance') + '–' + g('debord_seuil_escalade') + ' % vigilance · &gt; ' +
      g('debord_seuil_escalade') + ' % escalade · &gt; 100 % saturé (pièces hors zone en rouge)<br>Sélection filtrée : <b>' + n(selCount) + '</b> pièce' + (selCount > 1 ? 's' : '') + ' (les autres sont estompées)</div>';
    if (!TV) {
      html += '<div class="deb-cap"><label for="deb-cap"><b>Capacité du débord</b></label><div class="stepper"><button type="button" data-debstep="-1" aria-label="moins un">−</button>' +
        '<input type="number" id="deb-cap" min="1" step="1" value="' + cap + '"><button type="button" data-debstep="1" aria-label="plus un">+</button></div>' +
        '<button type="button" class="btn btn-small" data-act="save-debcap">Enregistrer</button>' +
        '<span class="who">' + (meta.by ? 'modifiée par ' + esc(meta.by) + ' le ' + esc(meta.at) : '') + '</span></div>';
    }
    html += '</div>';
    if (!pieces.length) {
      html += '<div class="empty"><b>Zone de débord vide</b>Aucun bloc ne dépasse sa capacité.</div>';
    }
    var nCells = Math.max(cap, pieces.length);
    var cells = '';
    for (var i = 0; i < nCells; i++) {
      var p = pieces[i];
      var out = i >= cap;
      if (!p) { cells += '<div class="slot"><span class="sid">D' + (i + 1) + '</span></div>'; continue; }
      var fk = p.prog + '-' + p.cadre;
      var b = blockById(p.blockId) || {};
      cells += '<div class="slot filled' + (out ? ' out' : '') + (i === 0 ? ' oldest' : '') + (vis[p.blockId] ? '' : ' dim') + '" title="' + esc(p.label + ' · OF ' + p.of + ' · ' + p.ref + ' · ' + n(p.age) + ' j') + '">' +
        '<span class="sid">' + (out ? 'HORS ZONE' : 'D' + (i + 1)) + '</span>' + (i === 0 ? '<span class="first">1er à reprendre</span>' : '') +
        '<span class="puck' + (FAM_LIGHT[fk] ? ' light' : '') + '" style="background:' + (FAM_COLORS[fk] || '#859199') + '">' + esc(p.cadre) + '</span>' +
        '<span class="plabel">' + esc((b.bloc || '').replace(p.cadre + ' ', '')) + '<br>' + esc(p.prog + ' ' + (b.version || '')) + '</span>' +
        '<span class="page">' + (out ? 'hors zone · ' : '') + n(p.age) + ' j</span></div>';
    }
    html += '<div class="deb-grid">' + cells + '</div>';
    html += '<div class="fam-legend">' + Object.keys(FAM_COLORS).map(function (k) { return '<span><i style="background:' + FAM_COLORS[k] + '"></i>' + k.replace('-', ' ') + '</span>'; }).join('') + '</div>';
    var over = (DATA.racks || []).filter(function (r) { return r.excess > 0; }).sort(function (a, b) { return b.excess - a.excess; });
    if (over.length) {
      html += '<h3 class="flux-head">Blocs en débord</h3><table class="tbl"><thead><tr><th>Bloc</th><th class="num">AJU</th><th class="num">Capacité</th><th class="num">Excédent</th><th class="num">Âge max</th><th>Lecture</th></tr></thead><tbody>' +

  function loadChartJs() {

      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';
      s.onload = resolve;
      s.onerror = function () { chartJsLoading = null; reject(new Error('Chart.js indisponible')); };
      document.head.appendChild(s);
    });
    return chartJsLoading;
  }

  function massChanges() {
    var field = $('#mass-field').value, mode = $('#mass-mode').value, val = Number($('#mass-value').value);
    return filtered().map(function (b) {
      var c = { blockId: b.id }, nv;
      if (mode === 'default') { c[field] = null; nv = field === 'cap' ? b.capDefault : field === 'maxi' ? b.maxiDefault : b.miniDefault; }
      else if (mode === 'pct') { nv = b.cap > 0 ? Math.ceil(val / 100 * b.cap) : 0; if (field === 'mini' && b.cap > 0) nv = Math.max(1, nv); c[field] = nv; }
      else { nv = Math.round(val); c[field] = nv; }
      var next = { cap: b.cap, maxi: b.maxi, mini: b.mini };
      next[field] = nv;
      c._b = b; c._from = b[field]; c._to = nv;
      c._ok = next.mini >= 0 && next.mini <= next.maxi && next.maxi <= next.cap;
      return c;
    });
  }
  function massPreview() {
    var ch = massChanges();
    var bad = ch.filter(function (c) { return !c._ok; }).length;
    $('#mass-preview').innerHTML = (bad ? '<p class="form-err">' + bad + ' bloc(s) ne respecteraient pas 0 ≤ mini ≤ maxi ≤ capacité et seront ignorés.</p>' : '') +

  function toggleRow(id) {
    if (TV) return;
    if (OPEN[id]) delete OPEN[id]; else OPEN[id] = true;
    var row = $('#row-' + cssId(id));
    var gr = groupsOf(filtered()).filter(function (x) { return x.id === id; })[0];
    if (!row || !gr) return renderBuffer();
    var det = $('#det-' + cssId(id));
    if (det) det.parentNode.removeChild(det);

    if (OPEN[id]) row.insertAdjacentHTML('afterend', detailHtml(gr));

  function toggleFilters() {
    S.filtersOpen = !S.filtersOpen;
    renderView();
    saveState();
    if (S.filtersOpen) { var q = $('#q'); if (q) q.focus(); }
  }

  function setFilter(key, val) {
    var arr = S[key], i = arr.indexOf(val);
    if (i >= 0) arr.splice(i, 1); else arr.push(val);
    renderAfterFilter();
  }
  function renderAfterFilter() {
    renderKpis(); renderFilters(); renderView(); renderFooter(); saveState();
  }

  function bind() {
    document.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('[data-act],[data-f],[data-view],[data-step],[data-debstep],.row,.modal-x') : null;
      if (!t) { if (e.target === $('#modal')) closeModal(); return; }
      if (t.classList.contains('modal-x')) return closeModal();
      if (t.hasAttribute('data-f')) return setFilter(t.getAttribute('data-f'), t.getAttribute('data-v'));
      if (t.classList.contains('tab')) { S.view = t.getAttribute('data-view'); renderTabs(); renderView(); saveState(); return; }
      if (t.hasAttribute('data-step')) {
        var box = t.closest('.settings'), id = box.getAttribute('data-id'), k = t.getAttribute('data-k');
        var d = draftOf(blockById(id));
        d[k] = Math.max(0, (Number(d[k]) || 0) + Number(t.getAttribute('data-step')));
        d.touched[k] = true;
        refreshSettings(id);
        return;
      }
      if (t.hasAttribute('data-debstep')) { var inp = $('#deb-cap'); inp.value = Math.max(1, (Number(inp.value) || 0) + Number(t.getAttribute('data-debstep'))); return; }
      if (t.classList.contains('row')) return toggleRow(t.getAttribute('data-id'));
      var act = t.getAttribute('data-act');
      if (act.indexOf('st:') === 0) {
        var st = act.slice(3);
        S.st = S.st.length === 1 && S.st[0] === st ? [] : [st];
        S.view = 'buffer'; renderTabs(); renderAfterFilter(); return;
      }
      if (act.indexOf('view:') === 0) { S.view = act.slice(5); renderTabs(); renderView(); saveState(); return; }
      if (act.indexOf('open:') === 0) {
        var oid = act.slice(5), ob = blockById(oid);
        S.view = 'buffer';
        if (ob && !matches(ob)) { S.st = []; S.q = ''; if (S.prog.length && S.prog.indexOf(ob.prog) < 0) S.prog.push(ob.prog); }
        var gid = groupIdOf(oid);
        OPEN[gid] = true; renderTabs(); renderAfterFilter();
        var r = $('#row-' + cssId(gid)); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      switch (act) {
        case 'reset-filters': FILTER_KEYS.forEach(function (k) { S[k] = clone(DEFAULT_STATE[k]); }); S.q = ''; renderAfterFilter(); break;
        case 'unmapped': openUnmapped(); break;
        case 'close-modal': closeModal(); break;
        case 'save-block': saveBlock(t.closest('.settings').getAttribute('data-id')); break;
        case 'reset-block':
          var rid = t.closest('.settings').getAttribute('data-id');
          if (confirm('Réinitialiser capacité, mini, maxi et unité de ce bloc aux valeurs L1 ?')) submitBlocks([{ blockId: rid, reset: true }]);
          break;
        case 'save-debcap':
          var v = Number($('#deb-cap').value);
          if (!(v >= 1)) return toast('Capacité invalide', true);
          run('saveGlobalParams', { debord_capacite: v }).then(function () { toast('Capacité du débord : ' + v + ' places'); JOURNAL = null; load(); }).catch(function (er) { toast(er.message, true); });
          break;
        case 'save-globals':
          var vals = {};
          $all('[data-g]').forEach(function (el) { if (String(el.value) !== String(g(el.getAttribute('data-g')))) vals[el.getAttribute('data-g')] = el.value; });
          if (!Object.keys(vals).length) return toast('Aucune modification');
          if (vals.annee_l1) S.year = vals.annee_l1;
          run('saveGlobalParams', vals).then(function (res) { toast(res.saved + ' paramètre(s) enregistré(s)'); JOURNAL = null; load(); }).catch(function (er) { toast(er.message, true); });
          break;
        case 'save-map':
          var mv = mapRowValues(t.closest('tr'));
          if (!mv.blockId) { var dis = t.closest('tr').querySelector('select[data-m="blockId"]'); if (dis && dis.disabled) mv.blockId = dis.value; }
          if (!mv.blockId) return toast('Choisissez un bloc', true);
          run('saveMapping', [mv]).then(function () { toast('Rattachement enregistré : ' + mv.ref); JOURNAL = null; load(); }).catch(function (er) { toast(er.message, true); });
          break;
        case 'del-map':
          var dref = t.closest('tr').getAttribute('data-ref');
          if (!confirm('Retirer le rattachement de ' + dref + ' ? Ses pièces remonteront dans « Réfs non rattachées ».')) return;
          run('saveMapping', [{ ref: dref, remove: true }]).then(function () { toast('Rattachement retiré'); JOURNAL = null; load(); }).catch(function (er) { toast(er.message, true); });
          break;
        case 'add-map':
          var nr = $('#new-ref').value.trim();
          if (!nr) return toast('Saisissez une réf', true);
          run('saveMapping', [{ ref: nr, blockId: $('#new-block').value, type: $('#new-type').value, aValider: $('#new-aval').checked }])
            .then(function () { toast('Réf ' + nr + ' rattachée'); JOURNAL = null; load(); }).catch(function (er) { toast(er.message, true); });
          break;
        case 'save-unmapped':
          var entries = $all('#modal-body tr[data-ref]').map(mapRowValues).filter(function (x) { return x.blockId; });
          if (!entries.length) return toast('Choisissez au moins un bloc', true);
          run('saveMapping', entries).then(function () { closeModal(); toast(entries.length + ' réf(s) rattachée(s)'); JOURNAL = null; load(); }).catch(function (er) { toast(er.message, true); });
          break;
        case 'apply-mass':
          var ch = massChanges().filter(function (c) { return c._ok; }).map(function (c) {
            var o = { blockId: c.blockId };
            ['cap', 'mini', 'maxi'].forEach(function (k) { if (Object.prototype.hasOwnProperty.call(c, k)) o[k] = c[k]; });
            return o;
          });
          if (!ch.length) return toast('Aucun bloc valide à modifier', true);
          submitBlocks(ch, closeModal);
          break;
        case 'snapshot':
          t.disabled = true;
          run('takeSnapshotManual').then(function (res) { toast('Photo enregistrée (' + res.rows + ' lignes)'); loadHistory(); }).catch(function (er) { t.disabled = false; toast(er.message, true); });
          break;
      }
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !$('#modal').hidden) return closeModal();
      var row = e.target.classList && e.target.classList.contains('row') ? e.target : null;
      if (row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleRow(row.getAttribute('data-id')); }
    });

    document.addEventListener('input', function (e) {
      var t = e.target;
      if (t.id === 'q') {
        clearTimeout(t._deb);
        t._deb = setTimeout(function () {
          S.q = t.value.trim();
          renderKpis(); renderView(); renderFooter(); renderFilterButton(); saveState();
          // met à jour les compteurs des puces sans perdre le focus de la recherche
          $all('.chip').forEach(function (c) {
            var key = c.getAttribute('data-f'), o = c.getAttribute('data-v');
            var cnt = DATA.blocks.filter(function (b) { return matches(b, key) && (key === 'ver' ? (b.version === o || b.refs.some(function (r) { return r.versionRef === o; })) : blockVal(b, key) === o); }).length;
            c.querySelector('.n').textContent = cnt;
          });
        }, 200);
        return;
      }
      if (t.closest && t.closest('.settings') && t.hasAttribute('data-k') && t.tagName === 'INPUT') {
        var id = t.closest('.settings').getAttribute('data-id');
        var d = draftOf(blockById(id));
        var k = t.getAttribute('data-k');
        d[k] = Math.max(0, Math.round(Number(t.value) || 0));
        d.touched[k] = true;
        clearTimeout(t._deb);
        t._deb = setTimeout(function () { refreshSettings(id); }, 350);
      }
      if (t.closest && t.closest('.mass-form')) massPreview();
    });

    document.addEventListener('change', function (e) {
      var t = e.target;
      if (t.id === 'year') { S.year = t.value; DRAFT = {}; load(); return; }
      if (t.id === 'sort') { S.sort = t.value; renderView(); saveState(); return; }
      if (t.id === 'print-size') { S.print = t.value; setPrintSize(); saveState(); return; }
      if (t.id === 'h-scope') { histoScope = t.value; renderHisto(); return; }
      if (t.id === 'h-days') { histoDays = Number(t.value); renderHisto(); return; }
      if (t.closest && t.closest('.settings') && t.getAttribute('data-k') === 'unit') {
        var id = t.closest('.settings').getAttribute('data-id');
        draftOf(blockById(id)).unit = t.value;
        refreshSettings(id);
        return;
      }
      if (t.closest && t.closest('.mass-form')) massPreview();
      if (t.closest && t.closest('tr[data-ref]')) t.closest('tr').classList.add('dirty');
    });

    $('#btn-refresh').onclick = function () { load(true); };
    $('#btn-mass').onclick = function () { closeMenu(); openMass(); };
    $('#btn-filters').onclick = toggleFilters;
    $('#btn-print').onclick = function () { closeMenu(); setPrintSize(); window.print(); };
    document.addEventListener('click', function (e) {
      var m = $('#more-menu');
      if (m && m.open && !m.contains(e.target)) m.open = false;
    }, true);
  }

  function closeMenu() { var m = $('#more-menu'); if (m) m.open = false; }

  function setPrintSize() {
    var st = $('#page-size');
    if (!st) { st = document.createElement('style'); st.id = 'page-size'; document.head.appendChild(st); }
    st.textContent = '@media print { @page { size: ' + (S.print === 'A3' ? 'A3' : 'A4') + ' landscape; margin: 8mm; } }';
  }

  /* ------------------------------------------------------------------ */
  /* Mode TV : plein écran, rotation KPI + A320 / KPI + A321 / débord    */
  /* ------------------------------------------------------------------ */
  var TV_SLIDES = [{ progs: ['A320'], view: 'buffer', label: 'A320' }, { progs: ['A321'], view: 'buffer', label: 'A321' }, { progs: ['A320', 'A321'], view: 'debord', label: 'Débord' }];
  function tvProgs() { return TV_SLIDES[tvSlide].progs; }

  function tvRender() {
    if (!DATA) return;
    var sl = TV_SLIDES[tvSlide];
    S.view = sl.view;
    renderHeader(); renderAlerts(); renderKpis(); renderFooter();
    ['buffer', 'debord', 'histo', 'params'].forEach(function (v) { $('#view-' + v).hidden = S.view !== v; });
    if (sl.view === 'buffer') renderBuffer(sl.progs);
    else { var keep = S.prog; S.prog = sl.progs; renderDebord(); S.prog = keep; }
    $('#tv-dots').innerHTML = TV_SLIDES.map(function (s, i) { return '<span class="' + (i === tvSlide ? 'on' : '') + '" title="' + s.label + '"></span>'; }).join('');
    tvFit();
  }

  /** Ajuste la taille de police pour que l'écran tienne sans défilement (12 blocs A321 sur un écran 1080p). */
  function tvFit() {
    var root = document.documentElement, size = 16;
    root.style.fontSize = size + 'px';
    while (document.documentElement.scrollHeight > window.innerHeight + 2 && size > 9) {
      size -= 0.5;
      root.style.fontSize = size + 'px';
    }
  }
  window.addEventListener('resize', function () { if (TV) tvFit(); });

  function startTv() {
    var tick = function () { $('#tv-clock').textContent = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); };
    tick(); setInterval(tick, 15000);
    var rotate = function () {
      tvSlide = (tvSlide + 1) % TV_SLIDES.length;
      tvRender();
      tvTimer = setTimeout(rotate, Math.max(5, Number(g('tv_rotation_s')) || 20) * 1000);
    };
    var refresh = function () {
      run('getDashboardData', { year: S.year || null }).then(function (d) { DATA = d; tvRender(); }).catch(function () { /* on garde l'affichage précédent */ });
      setTimeout(refresh, Math.max(1, Number(g('tv_refresh_min')) || 5) * 60000);
    };
    run('getDashboardData', { year: S.year || null }).then(function (d) {
      DATA = d; tvSlide = 0; tvRender();
      tvTimer = setTimeout(rotate, Math.max(5, Number(g('tv_rotation_s')) || 20) * 1000);
      setTimeout(refresh, Math.max(1, Number(g('tv_refresh_min')) || 5) * 60000);
      try { if (document.documentElement.requestFullscreen) document.addEventListener('click', function fs() { document.documentElement.requestFullscreen().catch(function () {}); document.removeEventListener('click', fs); }); } catch (e) { /* */ }
    }).catch(function (e) {
      showFatal(e.message);
      setTimeout(function () { location.reload(); }, 60000);
    });
  }

  /* ------------------------------------------------------------------ */
  /* Démarrage                                                           */
  /* ------------------------------------------------------------------ */
  function init() {
    bind();
    if (TV) {
      try { google.script.url.getLocation(function (loc) { var p = (loc && loc.parameter) || {}; if (p.year) S.year = p.year; startTv(); }); } catch (e) { startTv(); }
      return;
    }
    loadState(function () {
      renderTabs();
      setPrintSize();
      load(false);
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
